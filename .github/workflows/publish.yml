name: Publish release

# scripts/release.ps1 (in numo-app/sentinel) pushes a "publish/vX.Y.Z" branch with:
#   release/Sentinel_X.Y.Z_x64-setup.exe   signed NSIS installer
#   release/latest.json                    updater manifest read by installed copies
#   release/notes.md                       release notes
# This workflow turns it into a GitHub Release and deletes the branch.

on:
  push:
    branches: ["publish/**"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release files
        run: |
          set -euo pipefail
          version=$(jq -r .version release/latest.json)
          test "publish/v$version" = "$GITHUB_REF_NAME" || { echo "Branch and latest.json version differ"; exit 1; }
          ls release/*.exe
          jq -e '.platforms["windows-x86_64"].signature | length > 0' release/latest.json
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"; exit 1
          fi
          gh release create "$tag" release/*.exe release/latest.json \
            --title "Sentinel $VERSION" --notes-file release/notes.md --target main --latest

      - name: Delete the publish branch
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
